services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      # The RDS address comes from the .env file next to this one; without it,
      # a SQLite file in the frigi-data volume is used.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/frigi.db}
      DETECTOR_WEIGHTS: /app/weights/checkpoint_best_total.pth
    volumes:
      - ./backend/weights:/app/weights:ro
      - frigi-data:/app/data
      - frigi-cache:/app/cache
    restart: unless-stopped

  # HTTPS in front of the API. Only started with: docker compose --profile https up -d
  caddy:
    image: caddy:2.8
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      FRIGI_DOMAIN: ${FRIGI_DOMAIN:-}  # set in the .env file next to this one
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  frigi-data:
  frigi-cache:
  caddy-data:
