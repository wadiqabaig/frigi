services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      # Paths inside the container; the folders below are kept outside it.
      DATABASE_URL: sqlite:////app/data/frigi.db
      DETECTOR_WEIGHTS: /app/weights/checkpoint_best_total.pth
    volumes:
      - ./backend/weights:/app/weights:ro
      - frigi-data:/app/data
      - frigi-cache:/app/cache
    restart: unless-stopped

volumes:
  frigi-data:
  frigi-cache:
