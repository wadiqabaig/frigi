version: 1
applications:
  - appRoot: Frontend/frigi-app
    env:
      variables:
        # Public backend address, compiled into the site. API keys never go here.
        VITE_API_BASE_URL: https://frigi-app.duckdns.org
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 20
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
